# Nos testes, o Kafka padrão é um endereço que não existe: um teste nunca deve ler
# ou escrever no Kafka do Compose da máquina por acidente. Os testes que precisam de
# Kafka sobem um container próprio (@ServiceConnection substitui este endereço).
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=2000
